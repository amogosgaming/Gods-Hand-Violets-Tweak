name: Build

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - windows-legacy
          - linux
          - macos
          - android
      skip_emulator:
        description: "Skip Android emulator smoke test (faster APK-only runs)"
        required: false
        default: false
        type: boolean
      release:
        description: "Publish an official release with this tag (e.g. v2.0.0). Empty: only build."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core tests
    runs-on: ubuntu-24.04
    outputs:
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      run_desktop: ${{ steps.plan.outputs.run_desktop }}
      run_android: ${{ steps.plan.outputs.run_android }}
    steps:
      - uses: actions/checkout@v4
      - name: Select target platforms
        id: plan
        run: |
          p="${{ inputs.platforms || 'all' }}"
          case "$p" in
            windows)        m='[{"os":"windows-latest","name":"windows-x64-sse4","isa":"SSE4"},{"os":"windows-latest","name":"windows-x64-avx2","isa":"AVX2"},{"os":"ubuntu-22.04","name":"windows-vista-7-x86-sse2","mingw32":true,"isa":"SSE2"}]'; rd=true; ra=false ;;
            windows-legacy) m='[{"os":"ubuntu-22.04","name":"windows-vista-7-x86-sse2","mingw32":true,"isa":"SSE2"}]'; rd=true; ra=false ;;
            linux)          m='[{"os":"ubuntu-22.04","name":"linux-x64-sse4","isa":"SSE4"},{"os":"ubuntu-22.04","name":"linux-x64-avx2","isa":"AVX2"}]'; rd=true; ra=false ;;
            macos)          m='[{"os":"macos-15","name":"macos-arm64","isa":"AUTO"}]'; rd=true; ra=false ;;
            android)        m='[{"os":"ubuntu-22.04","name":"linux-x64-sse4","isa":"SSE4"}]'; rd=false; ra=true ;;
            *)              m='[{"os":"windows-latest","name":"windows-x64-sse4","isa":"SSE4"},{"os":"windows-latest","name":"windows-x64-avx2","isa":"AVX2"},{"os":"ubuntu-22.04","name":"windows-vista-7-x86-sse2","mingw32":true,"isa":"SSE2"},{"os":"ubuntu-22.04","name":"linux-x64-sse4","isa":"SSE4"},{"os":"ubuntu-22.04","name":"linux-x64-avx2","isa":"AVX2"},{"os":"macos-15","name":"macos-arm64","isa":"AUTO"}]'; rd=true; ra=true ;;
          esac
          echo "desktop_matrix=$m" >> "$GITHUB_OUTPUT"
          echo "run_desktop=$rd" >> "$GITHUB_OUTPUT"
          echo "run_android=$ra" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -S . -B build -DGH_BUILD_GAME=OFF -DGH_CPU_ISA=SSE4 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests (charts, gameplay rules, raster and audio rendering)
        run: ./build/gh_tests --audio

  build:
    name: Build ${{ matrix.name }}
    needs: tests
    if: ${{ needs.tests.outputs.run_desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tests.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux' && !matrix.mingw32
        run: bash tools/ci_apt_install.sh libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: MinGW-w64 dependencies (Windows Vista/7 x86 SSE2)
        if: matrix.mingw32
        run: bash tools/ci_apt_install.sh gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix binutils-mingw-w64-i686 ninja-build
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.mingw32 }}" = "true" ]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_SYSTEM_PROCESSOR=i686 \
              -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc-posix \
              -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++-posix \
              -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
              -DCMAKE_BUILD_TYPE=Release \
              -DGH_CPU_ISA=SSE2 \
              -DGH_WINDOWS_LEGACY=ON \
              -DGH_BUILD_TESTS=OFF
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGH_CPU_ISA="${{ matrix.isa }}" -DGH_BUILD_TESTS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGH_CPU_ISA="${{ matrix.isa }}" -DGH_BUILD_TESTS=OFF
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Audio & hitsound tests (Linux + raylib)
        if: runner.os == 'Linux' && !matrix.mingw32
        run: ./build/gh_tests
      - name: Note renderer assembly (MSVC)
        if: runner.os == 'Windows' && matrix.isa == 'SSE4'
        shell: bash
        run: |
          cmake -S . -B build-raster -DGH_BUILD_GAME=OFF -DGH_BUILD_TESTS=ON -DGH_CPU_ISA=SSE4
          cmake --build build-raster --config Release --target gh_tests --parallel
          build-raster/Release/gh_tests.exe --raster
      - name: Core tests on ARM64 (NEON)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-raster -DGH_BUILD_GAME=OFF -DGH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-raster --target gh_tests --parallel
          build-raster/gh_tests
      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist/Astralis
          mkdir -p dist/Astralis/mods
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../Astralis-${{ matrix.name }}.zip Astralis
          else
            zip -r ../Astralis-${{ matrix.name }}.zip Astralis
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Astralis-${{ matrix.name }}
          path: Astralis-${{ matrix.name }}.zip

  android:
    name: Build android
    needs: tests
    if: ${{ needs.tests.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null
          if ! command -v ninja > /dev/null; then
            "$sdkmanager" "cmake;3.22.1" > /dev/null
            mkdir -p "$RUNNER_TEMP/ninja"
            ln -sf "$ANDROID_HOME/cmake/3.22.1/bin/ninja" "$RUNNER_TEMP/ninja/ninja"
            echo "$RUNNER_TEMP/ninja" >> "$GITHUB_PATH"
          fi
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GH_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GH_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ANDROID_SDK="$ANDROID_HOME" bash android/build_apk.sh "$PWD/Astralis-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Astralis-android
          path: Astralis-android.apk

  android-test:
    name: Test android (emulator)
    needs: android
    if: ${{ inputs.skip_emulator != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Astralis-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play through the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/emulator_test.sh Astralis-android.apk android-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: android-shots

  release:
    name: Publish downloads
    needs: [tests, build, android, android-test]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.release != '') && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ inputs.release != '' || startsWith(github.ref, 'refs/tags/') }}
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        if: ${{ inputs.release != '' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          shopt -s nullglob
          files=()
          for f in artifacts/*.zip artifacts/*.apk; do
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then echo "No packages were built."; exit 1; fi
          ls -la artifacts
          cat > notes.md <<'EOF'
          | Download | System | How to play |
          |---|---|---|
          | `Astralis-windows-x64-avx2.zip` | Windows 7/8/10/11 (64-bit, AVX2 - Intel 4th gen+ / Ryzen) | Extract, run `astralis.exe` |
          | `Astralis-windows-x64-sse4.zip` | Windows 7/8/10/11 (64-bit, SSE4 - Intel 3rd gen & older) | Extract, run `astralis.exe` |
          | `Astralis-windows-vista-7-x86-sse2.zip` | Windows Vista/7+ (32-bit pure SSE2, OpenGL 2.1) | Extract, run `astralis.exe` |
          | `Astralis-linux-x64-avx2.zip` | Linux x64 (AVX2) | Extract, run `./astralis` |
          | `Astralis-linux-x64-sse4.zip` | Linux x64 (SSE4) | Extract, run `./astralis` |
          | `Astralis-macos-arm64.zip` | macOS (Apple Silicon) | Extract; first time, right-click `astralis` > Open |
          | `Astralis-android.apk` | Android 7+ | Open it on the phone and allow installing from this source |
          EOF
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tags look like v1.2.3, not '$tag'."; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Astralis $tag" --notes-file notes.md
          fi
